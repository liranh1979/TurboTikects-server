buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.4.2'
    }
}

// ProGuardTask import must be at top-level (Groovy import rule)
import proguard.gradle.ProGuardTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.turbotikects'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.infinispan:infinispan-bom:15.0.0.Final"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Infinispan 15 for Spring Boot 3
    implementation 'org.infinispan:infinispan-spring-boot3-starter-embedded'

    // Fixes the Scopes.GLOBAL warning
    compileOnly 'org.infinispan:infinispan-component-annotations'

    // Fixes the javax.transaction error
    implementation 'javax.transaction:javax.transaction-api:1.3'

    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.ldap:spring-ldap-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = file("${projectDir}/../ticketmaster-client")

// OS-aware npm command (npm.cmd is Windows-only)
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCmd = isWindows ? ['npm.cmd'] : ['npm']

task npmInstall(type: Exec) {
    workingDir frontendDir
    commandLine(*npmCmd, 'install')
    inputs.file("${frontendDir}/package.json")
    outputs.dir("${frontendDir}/node_modules")
}

task npmBuild(type: Exec, dependsOn: npmInstall) {
    workingDir frontendDir
    commandLine(*npmCmd, 'run', 'build')
    inputs.dir("${frontendDir}/src")
    inputs.file("${frontendDir}/package.json")
    outputs.dir("${projectDir}/src/main/resources/static")
}

processResources.dependsOn(npmBuild)

// ── ProGuard obfuscation (activated only with -Pobfuscate) ──────────────────
// Unpack + repack is handled by the Dockerfile; Gradle only compiles + obfuscates.
if (project.hasProperty('obfuscate')) {

    def obfuscationDir = layout.buildDirectory.dir("libs-obfuscation")
    def obfuscatedJar  = layout.buildDirectory.file("libs-obfuscation/app-obfuscated.jar")

    task plainJar(type: Jar, dependsOn: [compileJava, processResources]) {
        archiveFileName = 'app-plain.jar'
        destinationDirectory.set(obfuscationDir)
        from(sourceSets.main.output)
    }

    task obfuscate(type: ProGuardTask, dependsOn: plainJar) {
        configuration("${projectDir}/docker/proguard-rules.pro")

        injars(plainJar.archiveFile.get().asFile)
        outjars(obfuscatedJar.get().asFile)

        libraryjars(configurations.runtimeClasspath.filter { it.exists() })

        def javaHome = System.getProperty('java.home')
        ['java.base', 'java.desktop', 'java.sql', 'java.naming',
         'java.net.http', 'java.xml', 'java.management'].each { mod ->
            def jmod = file("${javaHome}/jmods/${mod}.jmod")
            if (jmod.exists()) {
                libraryjars(jmod, filter: '!**.jar;!module-info.class')
            }
        }

        printmapping(layout.buildDirectory.file("proguard-mapping.txt").get().asFile)
    }
}
