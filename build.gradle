buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.4.2'
    }
}

// ProGuardTask import must be at top-level (Groovy import rule)
import proguard.gradle.ProGuardTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.turbotikects'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.infinispan:infinispan-bom:15.0.0.Final"
        mavenBom "io.modelcontextprotocol.sdk:mcp-bom:2.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Infinispan 15 for Spring Boot 3
    implementation 'org.infinispan:infinispan-spring-boot3-starter-embedded'

    // Fixes the Scopes.GLOBAL warning
    compileOnly 'org.infinispan:infinispan-component-annotations'

    // Fixes the javax.transaction error
    implementation 'javax.transaction:javax.transaction-api:1.3'

    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.ldap:spring-ldap-core'

    // BCrypt password hashing (BCryptPasswordEncoder only — no Spring Security filter chain/autoconfig)
    implementation 'org.springframework.security:spring-security-crypto'

    // Email: JavaMail for IMAP/SMTP; Jsoup for HTML parsing + signature stripping
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.jsoup:jsoup:1.17.2'

    // Bouncy Castle: PEM parsing for SSL/TLS certificate management (handles PKCS1 + PKCS8 key formats)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // Groovy: runtime script compilation and execution for acceleration rules
    implementation 'org.apache.groovy:groovy:4.0.21'

    // JSONPath extraction for the external_api/mcp_tool workflow action items (FEAT-06 Phase 4+) —
    // admin/AI-authored response captures use JSONPath syntax rather than raw Jackson JsonPointer,
    // since LLMs reliably emit correct JSONPath and it reads more naturally to a non-developer admin.
    implementation 'com.jayway.jsonpath:json-path:2.9.0'

    // MCP (Model Context Protocol) Java SDK client, for the mcp_tool workflow action item
    // (FEAT-06 Phase 6). mcp-core + mcp-json-jackson2 explicitly, NOT the "mcp" convenience bundle —
    // that bundle pulls in mcp-json-jackson3 (Jackson 3, a different root package/artifact than
    // Spring Boot 3.2.5's Jackson 2 stack), which would ship a second JSON library this app doesn't
    // otherwise need. This app only ever acts as an MCP *client* (calls out to admin-configured
    // external MCP servers) — never as an MCP server itself, a deliberate scope decision (see the
    // FEAT-06 plan's Phase 6 section).
    implementation 'io.modelcontextprotocol.sdk:mcp-core'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2'

    // LangChain4j: replaces the hand-rolled java.net.http.HttpClient calls in llm/*Provider.java
    // with a real SDK (llm/LangChain4jSupport.java + each provider's send()). Pinned explicitly
    // rather than via langchain4j-bom, since the vendor-integration modules this app needs are at
    // a genuinely different maturity than core/open-ai as of this writing (confirmed on Maven
    // Central): langchain4j-core/langchain4j-open-ai are GA at 1.0.0, but langchain4j-anthropic/
    // langchain4j-google-ai-gemini/langchain4j-ollama are still only published at 1.0.0-beta5 — a
    // single BOM import wouldn't cleanly express that split. validateKey()/listModels() in every
    // provider stay hand-rolled HTTP; LangChain4j has no "list models"/"validate this key" API.
    implementation 'dev.langchain4j:langchain4j-core:1.0.0'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.0.0'          // OpenAI + DeepSeek + OpenRouter (all OpenAI-compatible via baseUrl)
    implementation 'dev.langchain4j:langchain4j-anthropic:1.0.0-beta5'
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini:1.0.0-beta5' // Gemini (beta surface) only — GeminiStableLlmProvider stays hand-rolled
    implementation 'dev.langchain4j:langchain4j-ollama:1.0.0-beta5'      // Gemma (local Ollama)

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = file("${projectDir}/../ticketmaster-client")

// OS-aware npm command (npm.cmd is Windows-only)
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCmd = isWindows ? ['npm.cmd'] : ['npm']

task npmInstall(type: Exec) {
    workingDir frontendDir
    commandLine(*npmCmd, 'install')
    inputs.file("${frontendDir}/package.json")
    outputs.dir("${frontendDir}/node_modules")
}

task npmBuild(type: Exec, dependsOn: npmInstall) {
    workingDir frontendDir
    commandLine(*npmCmd, 'run', 'build')
    inputs.dir("${frontendDir}/src")
    inputs.file("${frontendDir}/package.json")
    outputs.dir("${projectDir}/src/main/resources/static")
}

processResources.dependsOn(npmBuild)

// ── ProGuard obfuscation (activated only with -Pobfuscate) ──────────────────
// Unpack + repack is handled by the Dockerfile; Gradle only compiles + obfuscates.
if (project.hasProperty('obfuscate')) {

    def obfuscationDir = layout.buildDirectory.dir("libs-obfuscation")
    def obfuscatedJar  = layout.buildDirectory.file("libs-obfuscation/app-obfuscated.jar")

    task plainJar(type: Jar, dependsOn: [compileJava, processResources]) {
        archiveFileName = 'app-plain.jar'
        destinationDirectory.set(obfuscationDir)
        from(sourceSets.main.output)
    }

    task obfuscate(type: ProGuardTask, dependsOn: plainJar) {
        configuration("${projectDir}/docker/proguard-rules.pro")

        injars(plainJar.archiveFile.get().asFile)
        outjars(obfuscatedJar.get().asFile)

        libraryjars(configurations.runtimeClasspath.filter { it.exists() })

        def javaHome = System.getProperty('java.home')
        ['java.base', 'java.desktop', 'java.sql', 'java.naming',
         'java.net.http', 'java.xml', 'java.management'].each { mod ->
            def jmod = file("${javaHome}/jmods/${mod}.jmod")
            if (jmod.exists()) {
                libraryjars(jmod, filter: '!**.jar;!module-info.class')
            }
        }

        printmapping(layout.buildDirectory.file("proguard-mapping.txt").get().asFile)
    }
}
