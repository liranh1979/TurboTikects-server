spring.application.name=TurboTikects-server

# Server Configuration
server.port=${SERVER_PORT:3000}

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cmdb}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings — show-sql off: a real admin complaint, this printed every raw SQL
# statement unconditionally (bypassing the logger entirely, so no logging.level setting could
# silence it), most visibly a "Hibernate: SELECT * FROM ticket_update_queue ... FOR UPDATE SKIP
# LOCKED" line on every single tick of the queue-processing background poller — drowning out real
# request logs underneath a constant background stream.
spring.jpa.show-sql=false

# Root logger level: INFO and above only (INFO/WARN/ERROR) — no DEBUG/TRACE noise. Was previously
# left at Spring Boot's implicit default with an unused "logging.level.org.hibernate.orm.jdbc.bind=
# TRACE" override left over from the original project scaffold (never removed), which flooded the
# console with a "binding parameter (N:TYPE) <- [value]" line for every single JDBC bind on every
# query — real request logs were unreadable underneath it.
logging.level.root=INFO

spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-patterns=*:*
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

infinispan.embedded.config-xml=infinispan.xml

# Default @Scheduled pool size is 1 (shared by every @Scheduled class in the app: SlaSchedulerService,
# LdapSyncScheduler, AccelerationSchedulerService, AzureSyncScheduler, EmailPollingService,
# TimerAlertScheduler, TicketQueueProcessorService, DashboardReportSchedulerService,
# ApprovalEscalationSchedulerService — 9 as of FEAT-06 Phase 3). A single slow tick (e.g. a 30-40s
# LLM call inside DashboardReportSchedulerService) would otherwise completely block every other
# scheduled job — including time-sensitive SLA escalation firing — from running at all until it
# finishes, not just delay it. Bumped 4 -> 6 when the 9th scheduled class was added, cheap to set
# higher than strictly needed.
spring.task.scheduling.pool.size=6

app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

app.ldap.encryption-key=${LDAP_KEY:change-me-to-a-secret-32-char-key}

app.saml.sp-base-url=${APP_URL:http://localhost:3000}/api/v1
app.frontend.url=${APP_URL:http://localhost:3000}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

app.attachments.storage-path=${UPLOADS_PATH:./uploads}

app.version=${APP_VERSION:dev}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# FEAT-19 — AI-Generated MCP Servers. python-executable defaults to "python" for Windows dev;
# the Docker prod image has no bare "python" symlink on Alpine, so it overrides to "python3" via
# MCP_PYTHON_EXECUTABLE (see docker/Dockerfile and docker-compose.yml).
app.mcp.scripts-path=${MCP_SCRIPTS_PATH:./mcp-scripts}
app.mcp.python-executable=${MCP_PYTHON_EXECUTABLE:python}
app.mcp.port-range-start=${MCP_PORT_RANGE_START:9100}
app.mcp.port-range-end=${MCP_PORT_RANGE_END:9199}
app.mcp.pip-install-timeout-seconds=${MCP_PIP_INSTALL_TIMEOUT_SECONDS:120}
app.mcp.process-startup-grace-ms=${MCP_PROCESS_STARTUP_GRACE_MS:1500}
